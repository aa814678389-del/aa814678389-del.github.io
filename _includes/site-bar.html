{%- comment -%} Minimal header: mark, name, location, menu button. Transparent over an opener. {%- endcomment -%}
{%- assign profile = site.data.profile -%}
<header class="site-bar{% if include.overlay %} site-bar--overlay{% endif %}">
  <div class="site-bar__inner label">
    <a class="site-bar__mark" href="{{ '/' | relative_url }}" aria-label="{{ profile.name }}, home">{% include logo.html size=40 %}</a>
    <a class="site-bar__name" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>{{ profile.name }}</a>
    <span class="site-bar__loc">{{ profile.location }}</span>
    <button class="menu-btn label" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="site-menu">
      <span>Menu</span>
      <span class="menu-btn__icon" aria-hidden="true"><span></span><span></span></span>
    </button>
  </div>
</header>
