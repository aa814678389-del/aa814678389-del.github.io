{%- assign items = site.data.writing -%}
{%- if items and items.size > 0 -%}
<section id="featured" class="section wrap reveal" aria-labelledby="featured-heading">
  <div class="section__grid">
    <h2 id="featured-heading" class="section__label label">Featured</h2>
    <ul class="writing-list section__content" role="list">
      {%- for item in items %}
      <li class="writing-item">
        <a class="writing-item__link" href="{{ item.url }}">
          <span class="writing-item__title">{{ item.title }}</span>
          <span class="writing-item__meta">{% if item.kind %}{{ item.kind }} · {% endif %}{{ item.venue }}{% if item.year %} · {{ item.year }}{% endif %}</span>
        </a>
      </li>
      {%- endfor %}
    </ul>
  </div>
</section>
{%- endif -%}
