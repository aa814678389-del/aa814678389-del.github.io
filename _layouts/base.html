<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0b0d10">
  {% include seo.html %}
  <script>
    /* Runs before first paint: apply a saved theme, and opt in to JS-only effects.
       Scroll-reveal content is shown after 2.5s even if site.js never loads. */
    var d = document.documentElement;
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t; } catch (e) {}
    d.classList.add('js');
    setTimeout(function () { if (!d.dataset.reveal) d.classList.remove('js'); }, 2500);
  </script>
  <link rel="preload" href="{{ '/assets/fonts/inter-tight-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/inter-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {%- assign has_opener = page.opener | default: layout.opener -%}
  {% include site-bar.html overlay=has_opener %}

  <main id="main" tabindex="-1">
    {{ content }}
  </main>

  {% include footer-cta.html %}
  {% include menu.html %}
  <div class="cursor" aria-hidden="true"></div>
</body>
</html>
