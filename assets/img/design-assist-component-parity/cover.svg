<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img"><title>Pipeline: standards become a structured spec that an AI design assistant uses to produce matching Figma, web and Luau output</title><rect width="1200" height="750" fill="#eeebe3"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#545964"/></marker></defs><rect x="70" y="300" width="250" height="150" rx="10" fill="#fbfaf7" stroke="#c9c4b8" stroke-width="2"/><text x="195.0" y="375.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#1a1c22">Standards</text><text x="195.0" y="407.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#545964">docs + tokens</text><line x1="320" y1="375" x2="400" y2="375" stroke="#545964" stroke-width="2.5" marker-end="url(#a)"/><rect x="400" y="300" width="250" height="150" rx="10" fill="#dfe6f3" stroke="#1f4fa3" stroke-width="2"/><text x="525.0" y="375.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#1f4fa3">Structured spec</text><text x="525.0" y="407.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#1f4fa3">machine-readable</text><line x1="650" y1="375" x2="730" y2="375" stroke="#545964" stroke-width="2.5" marker-end="url(#a)"/><rect x="730" y="300" width="200" height="150" rx="10" fill="#fbfaf7" stroke="#c9c4b8" stroke-width="2"/><text x="830.0" y="375.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="600" fill="#1a1c22">AI design</text><text x="830.0" y="407.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#545964">assistant</text><line x1="930" y1="375" x2="1000" y2="240" stroke="#545964" stroke-width="2.5" marker-end="url(#a)"/><rect x="1000" y="190" width="150" height="100"