<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img"><title>Before: the same component renders with different sizes and shapes per platform. After: identical across Figma, web and Luau</title><rect width="1200" height="700" fill="#eeebe3"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#545964"/></marker></defs><text x="80" y="90" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#545964">BEFORE</text><text x="80" y="210" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#1a1c22">Figma</text><rect x="190" y="170" width="300" height="64" rx="8" fill="#1f4fa3" opacity="1"/><text x="80" y="390" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#1a1c22">Web</text><rect x="212" y="350" width="278" height="64" rx="26" fill="#545964" opacity="0.75"/><text x="80" y="570" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#1a1c22">Luau</text><rect x="230" y="530" width="260" height="64" rx="32" fill="#545964" opacity="0.75"/><text x="640" y="90" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="2" fill="#1f4fa3">AFTER</text><text x="640" y="210" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#1a1c22">Figma</text><rect x="750" y="170" width="300" height="64" rx="8" fill="#1f4fa3" opacity="1"/><text x="640" y="390" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#1a1c22">Web</text><rect x="750" y="350" width="300" height="64" rx="8" fill="#1f4fa3" opacity="1"/><text x="640" y="570" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#1a1c22">Luau</text><rect x="750" y="530" width="300" height="64" rx="8" fill="#1f4fa3" opacity="1"/></svg>
